<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" font-family="Arial, Helvetica, sans-serif">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f7f9fc; stroke: #34495e; stroke-width: 2; }
    .mcu { fill: #eef7ee; stroke: #2e7d32; stroke-width: 2.5; }
    .mainsbox { fill: #fdf2f0; stroke: #c0392b; stroke-width: 2; }
    .title { font-size: 22px; font-weight: bold; fill: #222222; }
    .sub { font-size: 13px; fill: #555555; }
    .h { font-size: 15px; font-weight: bold; fill: #222222; }
    .dev { font-size: 13px; font-weight: bold; fill: #34495e; }
    .pin { font-size: 13px; fill: #222222; }
    .lbl { font-size: 11px; fill: #555555; }
    .warn { font-size: 12px; font-weight: bold; fill: #c0392b; }
    .note { font-size: 13px; fill: #333333; }
    .w { stroke-width: 2.5; fill: none; }
    .spi { stroke: #1f77b4; }
    .ctl { stroke: #17a2b8; }
    .pwr { stroke: #d62728; }
    .gnd { stroke: #333333; }
    .gpio { stroke: #2ca02c; }
    .mains { stroke: #c0392b; stroke-width: 2.5; fill: none; stroke-dasharray: 6 4; }
    .coax { stroke: #555555; stroke-width: 4; fill: none; }
    .cu { stroke: #b87333; stroke-width: 5; fill: none; stroke-linecap: round; }
    .dot { fill: #333333; }
  </style>
  <rect class="bg" x="0" y="0" width="1300" height="720"/>

  <text x="650" y="38" text-anchor="middle" class="title">LoRaWell — Receiver wiring (ESP32-C3 SuperMini)</text>
  <text x="650" y="62" text-anchor="middle" class="sub">Logical wiring by GPIO number. Follow the pin labels printed on your board.</text>

  <!-- Antenna -->
  <text x="95" y="190" text-anchor="middle" class="dev">433 MHz dipole</text>
  <line class="cu" x1="95" y1="330" x2="95" y2="205"/>
  <line class="cu" x1="95" y1="350" x2="95" y2="475"/>
  <rect x="85" y="330" width="20" height="20" fill="#d4a017" stroke="#8a6d0b" stroke-width="1.5"/>
  <text x="108" y="262" class="lbl">17.3 cm</text>
  <text x="108" y="418" class="lbl">17.3 cm</text>
  <path class="coax" d="M105 340 H230"/>
  <text x="168" y="330" text-anchor="middle" class="lbl">IPEX–SMA</text>

  <!-- RA-02 -->
  <rect class="box" x="230" y="110" width="170" height="460" rx="6"/>
  <text x="315" y="138" text-anchor="middle" class="h">RA-02</text>
  <text x="315" y="156" text-anchor="middle" class="lbl">SX1278 · 433 MHz</text>
  <text x="240" y="344" class="pin">ANT</text>
  <text x="390" y="194" text-anchor="end" class="pin">SCK</text>
  <text x="390" y="239" text-anchor="end" class="pin">MISO</text>
  <text x="390" y="284" text-anchor="end" class="pin">MOSI</text>
  <text x="390" y="329" text-anchor="end" class="pin">NSS</text>
  <text x="390" y="374" text-anchor="end" class="pin">RESET</text>
  <text x="390" y="419" text-anchor="end" class="pin">DIO0</text>
  <text x="390" y="479" text-anchor="end" class="pin">3.3V</text>
  <text x="390" y="534" text-anchor="end" class="pin">GND</text>

  <!-- ESP32-C3 SuperMini -->
  <rect class="mcu" x="560" y="110" width="240" height="480" rx="8"/>
  <text x="680" y="138" text-anchor="middle" class="h">ESP32-C3</text>
  <text x="680" y="156" text-anchor="middle" class="lbl">SuperMini</text>
  <text x="570" y="194" class="pin">GPIO4</text>
  <text x="570" y="239" class="pin">GPIO5</text>
  <text x="570" y="284" class="pin">GPIO6</text>
  <text x="570" y="329" class="pin">GPIO7</text>
  <text x="570" y="374" class="pin">GPIO10</text>
  <text x="570" y="419" class="pin">GPIO3</text>
  <text x="570" y="479" class="pin">3V3</text>
  <text x="570" y="534" class="pin">GND</text>
  <text x="790" y="194" text-anchor="end" class="pin">GPIO0</text>
  <text x="790" y="254" text-anchor="end" class="pin">5V</text>
  <text x="790" y="314" text-anchor="end" class="pin">GND</text>
  <text x="680" y="575" text-anchor="middle" class="lbl">USB-C — 5 V adapter (1–2 A)</text>

  <!-- RA-02 to ESP32-C3 -->
  <path class="w spi" d="M400 190 H560"/>
  <path class="w spi" d="M400 235 H560"/>
  <path class="w spi" d="M400 280 H560"/>
  <path class="w ctl" d="M400 325 H560"/>
  <path class="w ctl" d="M400 370 H560"/>
  <path class="w ctl" d="M400 415 H560"/>
  <path class="w pwr" d="M400 475 H560"/>
  <path class="w gnd" d="M400 530 H560"/>
  <text x="520" y="184" text-anchor="middle" class="lbl">SCK</text>
  <text x="520" y="229" text-anchor="middle" class="lbl">MISO</text>
  <text x="520" y="274" text-anchor="middle" class="lbl">MOSI</text>
  <text x="520" y="319" text-anchor="middle" class="lbl">CS</text>
  <text x="520" y="364" text-anchor="middle" class="lbl">RESET</text>
  <text x="520" y="409" text-anchor="middle" class="lbl">DIO0</text>
  <text x="520" y="469" text-anchor="middle" class="lbl">3.3 V</text>
  <text x="520" y="524" text-anchor="middle" class="lbl">GND</text>

  <!-- C1 across RA-02 supply -->
  <path class="w pwr" d="M440 475 V497"/>
  <path class="w gnd" d="M440 509 V530"/>
  <path stroke="#333333" stroke-width="3" d="M426 497 H454 M426 509 H454"/>
  <circle class="dot" cx="440" cy="475" r="4"/>
  <circle class="dot" cx="440" cy="530" r="4"/>
  <text x="452" y="556" text-anchor="middle" class="lbl">C1 100–470 µF</text>
  <text x="452" y="571" text-anchor="middle" class="lbl">(recommended)</text>

  <!-- ESP32-C3 to relay module -->
  <path class="w gpio" d="M800 190 H920"/>
  <path class="w pwr" d="M800 250 H920"/>
  <path class="w gnd" d="M800 310 H920"/>
  <text x="860" y="184" text-anchor="middle" class="lbl">IN (LOW = ON)</text>
  <text x="860" y="244" text-anchor="middle" class="lbl">5 V</text>
  <text x="860" y="304" text-anchor="middle" class="lbl">GND</text>

  <!-- Relay module -->
  <text x="1010" y="155" text-anchor="middle" class="dev">Relay module 5 V · active-LOW</text>
  <rect class="box" x="920" y="165" width="180" height="170" rx="6"/>
  <text x="930" y="194" class="pin">IN</text>
  <text x="930" y="254" class="pin">VCC</text>
  <text x="930" y="314" class="pin">GND</text>
  <text x="1090" y="214" text-anchor="end" class="pin">COM</text>
  <text x="1090" y="264" text-anchor="end" class="pin">NO</text>
  <text x="1090" y="314" text-anchor="end" class="pin">NC (unused)</text>

  <!-- Contacts to starter -->
  <path class="mains" d="M1100 210 H1150"/>
  <path class="mains" d="M1100 260 H1150"/>
  <rect class="mainsbox" x="1150" y="180" width="130" height="110" rx="6"/>
  <text x="1215" y="212" text-anchor="middle" class="dev">Starter</text>
  <text x="1215" y="230" text-anchor="middle" class="lbl">contactor coil</text>
  <text x="1215" y="246" text-anchor="middle" class="lbl">control circuit</text>
  <text x="1215" y="268" text-anchor="middle" class="lbl">(not motor current)</text>
  <text x="1215" y="312" text-anchor="middle" class="warn">Mains wiring by a</text>
  <text x="1215" y="328" text-anchor="middle" class="warn">qualified electrician</text>

  <!-- Pin dots -->
  <g class="dot">
    <circle cx="400" cy="190" r="3"/><circle cx="560" cy="190" r="3"/>
    <circle cx="400" cy="235" r="3"/><circle cx="560" cy="235" r="3"/>
    <circle cx="400" cy="280" r="3"/><circle cx="560" cy="280" r="3"/>
    <circle cx="400" cy="325" r="3"/><circle cx="560" cy="325" r="3"/>
    <circle cx="400" cy="370" r="3"/><circle cx="560" cy="370" r="3"/>
    <circle cx="400" cy="415" r="3"/><circle cx="560" cy="415" r="3"/>
    <circle cx="400" cy="475" r="3"/><circle cx="560" cy="475" r="3"/>
    <circle cx="400" cy="530" r="3"/><circle cx="560" cy="530" r="3"/>
    <circle cx="800" cy="190" r="3"/><circle cx="920" cy="190" r="3"/>
    <circle cx="800" cy="250" r="3"/><circle cx="920" cy="250" r="3"/>
    <circle cx="800" cy="310" r="3"/><circle cx="920" cy="310" r="3"/>
  </g>

  <!-- Notes -->
  <text x="40" y="626" class="note">• Relay is active-LOW: GPIO0 LOW = relay ON. The firmware preloads HIGH at boot, so the relay never clicks on during start-up.</text>
  <text x="40" y="648" class="note">• The relay switches the starter's contactor coil, never the motor current directly.</text>
  <text x="40" y="670" class="note">• RA-02 is 3.3 V only. Never power the board without its 433 MHz antenna attached.</text>
  <text x="40" y="692" class="note">• The relay must release when GPIO0 is HIGH (3.3 V). If it does not, see the relay notes in docs/hardware.md.</text>
</svg>
